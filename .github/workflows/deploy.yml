name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and verify the deployment origin.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Node version
        id: nvmrc
        # withastro/action takes a version string, not a version file, so read
        # .nvmrc here instead of hardcoding the version a second time.
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Build with Astro
        uses: withastro/action@v6
        # withastro/action installs deps, runs the build, and uploads ./dist
        # as the Pages artifact. `site`/`base` come from astro.config.mjs.
        with:
          node-version: ${{ steps.nvmrc.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
